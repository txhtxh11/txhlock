plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kidslock'
    compileSdk 34

    defaultConfig {
        applicationId "com.kidslock"
        minSdk 18
        targetSdk 33
        versionCode 32
        versionName "1.9.1"
    }

    signingConfigs {
        // 复用 Android 调试签名（与电视上已装的 v0.6/0.7 一致），保证可直接覆盖安装、不丢设置
        release {
            storeFile file("${System.properties['user.home']}\\.android\\debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            // 关闭调试包签名，便于 TV 上直接安装 release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 中文字符串资源编码
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// SMB 客户端库（局域网共享题库同步）+ slf4j 空实现（Android 无自带实现）
dependencies {
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.7'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kidslock'
    compileSdk 34

    defaultConfig {
        applicationId "com.kidslock"
        minSdk 18
        targetSdk 33
        versionCode 123
        versionName "1.9.33"
    }

    signingConfigs {
        // 澶嶇敤 Android 璋冭瘯绛惧悕锛堜笌鐢佃涓婂凡瑁呯殑 v0.6/0.7 涓€鑷达級锛屼繚璇佸彲鐩存帴瑕嗙洊瀹夎銆佷笉涓㈣缃?
        release {
            storeFile file("${System.properties['user.home']}\\.android\\debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
        debug {
            // 鍏抽棴璋冭瘯鍖呯鍚嶏紝渚夸簬 TV 涓婄洿鎺ュ畨瑁?release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 涓枃瀛楃涓茶祫婧愮紪鐮?
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

// SMB 瀹㈡埛绔簱锛堝眬鍩熺綉鍏变韩棰樺簱鍚屾锛? slf4j 绌哄疄鐜帮紙Android 鏃犺嚜甯﹀疄鐜帮級
dependencies {
    implementation files('libs/core-3.3.0.jar')
    implementation 'eu.agno3.jcifs:jcifs-ng:2.1.7'
    implementation 'org.slf4j:slf4j-nop:1.7.36'
}

